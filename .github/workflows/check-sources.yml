name: Check IPTV Sources

on:
  # 手动触发
  workflow_dispatch: {}

  # 每6小时自动跑一次，错开 sync-upstream.yml 半小时，
  # 让它先同步完上游最新列表，这个再基于最新列表做校验
  schedule:
    - cron: '30 */6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run source checker
        run: python tools/check_sources.py

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit and push results if changed
        run: |
          git add tv/aggregated_checked.txt tv/aggregated_checked.m3u
          if git diff --cached --quiet; then
            echo "本次校验结果与上次一致，无需提交"
          else
            git commit -m "chore: 自动聚合校验直播源 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin master
          fi

      - name: Write step summary
        if: always()
        run: |
          if [ -f check_summary.md ]; then
            cat check_summary.md >> $GITHUB_STEP_SUMMARY
          fi
